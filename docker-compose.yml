# Runs both the Streamlit dashboard and the FastAPI backend together.
#
# Usage:  docker compose up --build
#   Dashboard: http://localhost:8501
#   API docs:  http://localhost:8000/docs
#
# NOTE: not build/run-tested in the development sandbox (no Docker
# daemon available there) -- please run this yourself and report back
# if anything needs adjusting.

services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"

  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
